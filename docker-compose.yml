# Déploiement VPS : `cp .env.example .env`, renseigner DOMAIN + clés API, puis `docker compose pull && docker compose up -d`
# (l'image est publiée par la CI sur ghcr.io ; `docker compose up -d --build` reconstruit depuis les sources).
# HTTPS automatique (Let's Encrypt) via Caddy : DOMAIN doit pointer vers le VPS (ports 80 et 443 ouverts).
services:
  app:
    build: .
    image: ${BT_URL_IMAGE:-ghcr.io/tiemtore-dev/bt-url:latest}
    restart: unless-stopped
    env_file: .env
    environment:
      # L'application n'est joignable que via Caddy (aucun port publié) : l'IP cliente vient de
      # X-Forwarded-For, posé par Caddy (jamais par le client).
      BT_URL_TRUST_PROXY: "true"
    expose:
      - "8000"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    pids_limit: 200
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      DOMAIN: ${DOMAIN:?Renseigner DOMAIN dans .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt:
      - no-new-privileges:true

volumes:
  caddy_data:
  caddy_config:
