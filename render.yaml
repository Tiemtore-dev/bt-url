# Blueprint Render : https://render.com/docs/blueprint-spec
services:
  - type: web
    name: bt-url
    runtime: docker
    plan: starter        # >= 1 Go de RAM recommandé (modèle LightGBM de 183 Mo)
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      # Secrets : à saisir dans le tableau de bord Render (jamais dans git)
      - key: VIRUSTOTAL_API_KEY
        sync: false
      - key: GOOGLE_SAFEBROWSING_API_KEY
        sync: false
      - key: OTX_API_KEY
        sync: false
      - key: ABUSECH_API_KEY
        sync: false
      # Protection de vos quotas
      - key: BT_URL_RATE_PER_MIN
        value: "3"
      - key: BT_URL_RATE_PER_HOUR
        value: "20"
      - key: BT_URL_GLOBAL_PER_MIN
        value: "4"
      - key: BT_URL_DAILY_BUDGET
        value: "300"
      - key: BT_URL_CACHE_TTL
        value: "3600"
      - key: BT_URL_TRUST_PROXY
        value: "true"
